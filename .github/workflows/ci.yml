name: CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/frontend/**"
      - "package.json"
      - "package-lock.json"
      - ".github/actions/quality-and-build/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

env:
  SITE_URL: https://${{ github.repository_owner }}.github.io
  BASE_PATH: /${{ github.event.repository.name }}

jobs:
  quality-and-build:
    name: Quality and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Quality and build
        uses: ./.github/actions/quality-and-build
